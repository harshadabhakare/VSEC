<!DOCTYPE html>
<html>
<head>
    <title>Hostel Finder - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#e6f2ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.form-box{
    width:300px;
    padding:20px;
    background:white;
    border:1px solid gray;
    border-radius:8px;
    text-align:center;
}

input{
    width:90%;
    padding:8px;
    margin:8px 0;
}

button{
    width:95%;
    padding:8px;
    background:#0077cc;
    color:white;
    border:none;
    border-radius:5px;
}

button:hover{
    background:#005fa3;
}

a{
    color:#0077cc;
    text-decoration:none;
}

</style>

<body class="background">

<div class="form-box">

    <h1>🏠 Hostel Finder</h1>
    <h2>Create Account</h2>

    <input type="text" placeholder="Full Name">
    <br></br>
    <input type="email" placeholder="Email Address">
    <br></br>
    <input type="tel" placeholder="Phone Number">
    <br></br>
    <input type="password" placeholder="Password">
    <br></br>
    <input type="password" placeholder="Confirm Password">
    <br></br>
    <button>Sign Up</button>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

</body>
</html>
